<!doctype html>
<html lang="en" id="top">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f0" />
    <meta
      name="description"
      content="Big cities. Small-town connections. MoveON is a simpler way to discover inter-city coaches, trains, and regional shuttles across Ontario."
    />
    <title>MoveON — Ontario, a little closer</title>
    <script>
      ;(() => {
        let theme = 'system'
        try {
          theme = localStorage.getItem('moveon:theme') || 'system'
        } catch {}
        const dark =
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#15221d' : '#f7f6f0'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
