<!DOCTYPE html>
<html>
<head>
  <title>Admin Login Test</title>
</head>
<body>
  <h2>Admin Login</h2>

  <input id="email" type="email" placeholder="Email">
  <br><br>

  <input id="password" type="password" placeholder="Password">
  <br><br>

  <button id="loginBtn">Login</button>
  <button id="checkBtn">Who Am I?</button>
<button id="updateBtn">Test Update</button>
<button id="refreshBtn">Test Refresh</button>

  <pre id="output"></pre>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
     const url = import.meta.env.VITE_SUPABASE_URL?.trim()
  const key = import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY?.trim()

    const supabase = createClient(
      url,
      key
    );


    const output = document.getElementById("output");

    document.getElementById("loginBtn").onclick = async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { data, error } =
        await supabase.auth.signInWithPassword({
          email,
          password
        });

      output.textContent = error
        ? JSON.stringify(error, null, 2)
        : `Logged in!\nUser ID: ${data.user.id}`;
    };

    document.getElementById("checkBtn").onclick = async () => {
      const {
        data: { user }
      } = await supabase.auth.getUser();

      output.textContent = user
        ? JSON.stringify(user, null, 2)
        : "Not logged in";
    };


  document.getElementById("updateBtn").onclick = async () => {
const { data: userData } = await supabase.auth.getUser();

const { data: adminRow } = await supabase
  .from("admins")
  .select("*")
  .eq("user_id", userData.user.id);

//console.log(adminRow);





//check admin credentials
const { data1, error1 } = await supabase
  .from("admins")
  .select("*")
  .eq("user_id", userData.user.id);
console.log(data1, error1);

console.log(userData.user.id);
const {
  data: { user }
} = await supabase.auth.getUser();

console.log(user.id);

  const { data, error } = await supabase
    .from("stop_times")     // use a table you know exists
    .update({
     arrival_time: "2024-06-10 12:00:00",
    })
    .eq("ID", 1)


  console.log(data, error);
  output.textContent = JSON.stringify(
    { data, error },
    null,
    2
  );
};

document.getElementById("refreshBtn").onclick = async () => {
  const { data, error } = await supabase
    .from("stop_times")     // use a table you know exists
    .select("*")
    .limit(5)
  console.log(data, error);
  output.textContent = JSON.stringify(
    { data, error },
    null,
    2
  );
};

  </script>
</body>
</html>
